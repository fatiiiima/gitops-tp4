apiVersion: v1
kind: ConfigMap
metadata:
  name: tp4-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  tp4-dashboard.json: |
    {
      "uid": "tp4-gitops",
      "title": "TP4 - GitOps & Workloads",
      "tags": [
        "tp4"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "ArgoCD - Apps par Sync Status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (sync_status) (argocd_app_info)",
              "legendFormat": "{{sync_status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "ArgoCD - Apps par Health Status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (health_status) (argocd_app_info)",
              "legendFormat": "{{health_status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "ArgoCD - Historique des syncs (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (name) (increase(argocd_app_sync_total[5m]))",
              "legendFormat": "{{name}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "ArgoCD - Appels Git (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (request_type) (increase(argocd_git_request_total[5m]))",
              "legendFormat": "{{request_type}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pods - Desired vs Available vs Unavailable",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 8,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_spec_replicas{namespace=\"podinfo\"}",
              "legendFormat": "Desired",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "kube_deployment_status_replicas_available{namespace=\"podinfo\"}",
              "legendFormat": "Available",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "C",
              "expr": "kube_deployment_status_replicas_unavailable{namespace=\"podinfo\"}",
              "legendFormat": "Unavailable",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pods en erreur (ImagePull/CrashLoop)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 8,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod, reason) (kube_pod_container_status_waiting_reason{namespace=\"podinfo\",reason=~\"ImagePullBackOff|ErrImagePull|CrashLoopBackOff\"})",
              "legendFormat": "{{pod}} {{reason}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU par pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"podinfo\",container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Mémoire par pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"podinfo\",container!=\"\"})",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Redémarrages (10m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"podinfo\"}[10m]))",
              "legendFormat": "{{pod}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requêtes HTTP podinfo (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=\"podinfo\"}[1m]))",
              "legendFormat": "req/s",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Alertes actives",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ALERTS{alertstate=\"firing\"}",
              "legendFormat": "{{alertname}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        }
      ]
    }
